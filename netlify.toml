[build]
publish = "."
functions = "netlify/functions"

  [build.environment]

[functions]

  [functions."*"]

[[redirects]]
from = "/detector"
to = "/detector.html"
status = 200
force = false

[[redirects]]
from = "/kalahari"
to = "/kalahari.html"
status = 200
force = false

[[redirects]]
from = "/broadcast"
to = "/index.html?entry=direct"
status = 200
force = false

# raritydetector.com (domain alias on this site) opens straight into the Detector
[[redirects]]
from = "https://raritydetector.com/"
to = "/detector.html"
status = 200
force = true

[[redirects]]
from = "https://www.raritydetector.com/"
to = "/detector.html"
status = 200
force = true
